name: Deploy to GitHub Pages

on:
  # Runs every time you push to main
  push:
    branches: [main]
  # Lets you run it by hand from the Actions tab
  workflow_dispatch:

# Allow this workflow to read the repo and publish to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; a newer push cancels an older one in progress
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Install, build, and upload the site
        uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
